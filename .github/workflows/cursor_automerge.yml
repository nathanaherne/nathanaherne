name: Cursor safe auto-merge

# This file is trusted only after it is on the default branch. pull_request_target
# and workflow_run both run that copy. The job checks out the default branch and
# never checks out the pull request head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Profile CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Pull request number to evaluate"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: cursor-automerge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || inputs.pull_number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the trusted gate
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: Evaluate the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: python3 scripts/automerge_cursor_pr.py
